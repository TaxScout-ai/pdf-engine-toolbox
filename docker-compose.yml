version: "3.8"

services:
  pdf-engine:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT to the full public Git SHA}
    ports:
      - "8000:8000"
    environment:
      - PDF_ENGINE_SECRET=local-dev-secret-change-me
      - LOG_LEVEL=debug
      - MAX_UPLOAD_SIZE_MB=100
      - WORKERS=1
      - REQUEST_TIMEOUT_SECONDS=120
      - PDF_SOURCE_ALLOWED_HOSTS=taxscout-local.s3.us-east-1.amazonaws.com
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
